name: CI/CD Pipeline


on:
  push:
    branches: [aula-25/08]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.14'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: Subir o servidor em background
        run: python app.py & sleep 2

      - name: Verificar saúde do servidor
        run: |
          response=$(curl -s http://localhost:5000/health)
          echo "Resposta do servidor: $response"
          echo "$response" | grep -q '"status": "ok"' || (echo "Servidor não respondeu" && exit 1)

      - name: Desligar o servidor
        run: pkill -f app.py || true
        